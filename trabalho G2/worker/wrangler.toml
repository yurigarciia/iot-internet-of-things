name = "silo-iot"
main = "worker.js"
compatibility_date = "2024-09-01"

[vars]
RETENCAO_DIAS = "30"           # leituras mais antigas que isso sao apagadas

# D1 = historico (cada leitura e uma linha). KV = ultimo estado e cooldown de alertas.
# Em desenvolvimento local (wrangler dev --local) os ids abaixo podem ficar como estao.
# Para publicar: wrangler d1 create silo ; wrangler kv namespace create SILO_KV  -> cole os ids.
[[d1_databases]]
binding = "DB"
database_name = "silo"
database_id = "SEU_D1_DATABASE_ID"

[[kv_namespaces]]
binding = "KV"
id = "SEU_KV_NAMESPACE_ID"

# Segredos NAO ficam aqui:
#   local   -> arquivo .dev.vars (fora do Git)
#   nuvem   -> wrangler secret put TOKEN_ESCRITA ; wrangler secret put TOKEN_LEITURA
